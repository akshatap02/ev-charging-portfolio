<style>

.show-kpi:nth-child(2):before{background:#AD537E}.show-kpi:nth-child(3):before{background:#D88A53}.show-kpi:nth-child(4):before{background:#EDC36D}

.arch .layer b{color:#3B2B5E}.arch .layer small{color:#5E6A80;font-size:13.5px;line-height:1.55}

.note{border:1px solid #E9DCCB;background:#FBF6EE;color:#6E5332;border-radius:10px;padding:14px 18px;line-height:1.6;margin:14px 0;font-size:14px}

.show-file a{font-weight:700;color:#634A98;text-decoration:none}.show-file a:hover{text-decoration:underline}
.show-file p{color:#71617a;font-size:12.5px;line-height:1.6;margin:6px 0 0}

 .shell{display:block}

 .navbtn.active{border-bottom-color:var(--gold)}

}
</style></head><body>
<div class="shell">
<aside class="side">
 <div class="identity"><div class="logo">▣</div><div><div class="brand">KLE Technological<br>University</div><div class="caption">Foundation Integration</div></div></div>
 <div class="navhead">PROJECT PORTFOLIO <span class="badge">CS · V</span></div>
 <input id="search" class="search" placeholder="⌕ Find a section..." oninput="filterNav(this.value)" aria-label="Find a section">
 <nav id="nav"></nav>
</aside>
<div class="right">
 <header class="topbar"><div class="crumb" id="crumb">Computer Science › EV Charging Allocation</div>
  <div class="actions"><span class="status">● Showcase view</span><a class="btn secondary" href="https://github.com/srujanab24/EV_Charging_Allocation" target="_blank" rel="noopener">↗ GitHub repository</a></div></header>
 <main class="content"><div id="screen"></div></main>
</div>
</div>

<script>
const REPO='https://github.com/srujanab24/EV_Charging_Allocation';
const F=p=>`<a href="${REPO}/blob/main/${p}" target="_blank" rel="noopener"><code>${p}</code></a>`;
const T=(head,rows,numCols=[])=>`<div class="table-scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${numCols.includes(i)?' class="num-cell"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const SH=t=>`<span class="subhead">${t}</span>`;
const TBD='<div class="show-empty">To be added by the team.</div>';

const PROJECT={
 team:'Team 12 · CSE (AI)',
 title:'EV Charging Concurrent Booking and Resource Allocation',
 theme:'Concurrent Booking and Resource Allocation',
 product:'EV Charging Allocation web app'
};

const STAGES=[
 ['problem','Problem Definition and Need Identification','Gate 0 — Problem Approval'],
 ['requirements','Requirements Engineering and Acceptance Criteria','Gate 1 — Requirements Baseline'],
 ['architecture','System Architecture','Sprint 1 — Gate 2 Preparation'],
 ['dataapi','Data Model and API Design','Sprint 1 — Gate 2 Preparation'],
 ['algorithm','Algorithm and Business Logic','Sprint 1 — Detailed Design'],
 ['implementation','Implementation and Version Control Discipline','Sprint 1 — Initial Implementation'],
 ['testing','Testing and Validation','Validation and Integration'],
 ['improvement','Documented Improvement','Validation and Improvement'],
 ['foundation','Foundation Integration','Across all stages'],
 ['evidence','Technical Evidence Repository','Across all gates'],
 ['investigations','Tests and Investigations','Testing and Validation'],
 ['reviews','Reviews and Responses','Gate-wise Review'],
 ['reflections','Individual Learning','Each student; each stage'],
 ['synthesis','Final Synthesis','Final Integration']
];

/* Each section: list of [field label, html answer or null when not yet documented] */
const S={};

S.team={title:'Team and roles',phase:'Project identity',subtitle:'Make contributions visible and build understanding of the complete system.',fields:[
 ['Guide or mentor','Mrs. Sneha Varur'],
 ['Academic year','Team 12 · CSE (AI) · School of Computer Science &amp; Engineering (Artificial Intelligence) · Mini Project'],
 ['Team members — name and USN',`${T(['Member','Name','USN'],[['01','Srujana B','01FE24BCI041'],['02','Mythri Gaded','01FE24BCI031'],['03','Akshata Patil','01FE24BCI088'],['04','Vandana A M','01FE24BCI075']])}`],
 ['Assigned roles and responsibilities',T(['Member','Foundation course','Engine and responsibility'],[
   ['Srujana B','Data Structures &amp; Algorithms','E1 · Request &amp; Scheduling: receives requests and orders them by time and priority.'],
   ['Mythri Gaded','Database Management Systems','E2 · Booking Consistency: transactions keep booking records correct (commit / rollback).'],
   ['Akshata Patil','OSPP','E3 · Concurrent Allocation: locks charging points to stop two requests getting the same one.'],
   ['Vandana A M','Software Engineering','E4 · Validation &amp; Quality: checks every charger state change against the rules and acceptance conditions. Also owns the SRS, use cases and traceability for the whole project.']])],
 ['Repository or shared evidence folder link',`<a href="${REPO}" target="_blank" rel="noopener">${REPO}</a>`]
]};

S.problem={subtitle:'Record the evidence behind the problem choice and the reasoning that led to the artefact.',fields:[
 ['Users and problem we investigated',`<p>EV owners and charging-station operators. A station has a limited number of charging points, but many vehicles may request charging at the same time.</p>
 <p>The system must decide:</p><ul><li>Which vehicle gets a charging point, and which point is compatible with it?</li><li>What happens when two users request the same point at the same moment?</li><li>What happens when every point is occupied?</li><li>Which request should be served first, and what happens when a booking is modified or cancelled?</li></ul>
 <p><b>In one line:</b> a smart manager that accepts EV charging requests, checks compatible free points, orders requests by priority, and allocates without creating conflicting bookings.</p>`],
 ['Current process and evidence of need',`<p>Without coordinated allocation, a first-come-first-served approach can double-book a point, ignore connector compatibility, and simply reject users when points are busy.</p>
 <p>Real data used to understand charging behaviour:</p>${T(['Metric (ChargingRecords dataset)','Value'],[['Charging sessions','72,843'],['Unique users','2,337'],['Unique chargers','2,119'],['Average session duration','151.22 minutes']],[1])}
 <p>India-specific infrastructure data: the BEE public charging-station list (15,470 cleaned station records with location, charger type and rating), showing a heterogeneous mix of connector standards (Type-2 AC, CCS2, CHAdeMO, Bharat AC/DC, LECCS for two-wheelers).</p>`],
 ['Scope, constraints and assumptions',`${SH('In scope')}<ul><li>Booking requests with vehicle model, start time, current and target battery level, priority and optional location.</li><li>Manufacturer-verified connector compatibility between vehicle and charging point.</li><li>Conflict-free allocation, a priority-ordered waiting queue, ranked alternatives, cancellation and modification.</li></ul>
 ${SH('Out of scope')}<ul><li>Payments, live charger telemetry and physical charger control.</li></ul>
 ${SH('Assumptions')}<ul><li>A smaller priority number means a higher priority; ties are served in arrival order.</li><li>Charging efficiency defaults to 90% when estimating duration.</li><li>The historical CSV dataset is used for analysis; live allocation is handled by the backend and MySQL.</li></ul>`],
 ['Roles and permission rules',`<ul><li><b>EV user</b>: submit a request, view own bookings, cancel or modify a confirmed booking.</li><li><b>System / operator</b>: process the waiting queue, expire stale requests and record every decision in <code>allocation_logs</code>.</li></ul><p>Only <code>CONFIRMED</code> bookings can be cancelled or modified. Authentication is not yet implemented.</p>`],
 ['Foundation concepts used',`<ul><li>Data structures: queue (FIFO), binary min-heap priority queue.</li><li>Algorithms: searching, interval-overlap checking, multi-key sorting, Haversine distance.</li><li>Databases: relational schema, transactions, row locking.</li><li>Operating-system concepts: concurrency, mutual exclusion, race conditions.</li></ul>`],
 ['Evidence links and next action',`<p>Datasets: ${F('data/raw/ChargingRecords_All_Unique_Records.csv')}, ${F('data/processed/bee_charging_stations_india_cleaned.csv')}.</p><p><b>Next action:</b> record the Gate 0 faculty review outcome.</p>`]
]};

S.requirements={subtitle:'Translate the approved need into clear, testable software requirements.',fields:[
 ['Functional requirements',T(['ID','Requirement','Implemented in'],[
  ['FR-01','Accept a booking request with user ID, vehicle model, start time, current battery, target battery (default 80%), priority and optional latitude/longitude.','<code>POST /api/booking-requests</code>'],
  ['FR-02','Reject invalid input: non-positive IDs, battery outside 0–100, target ≤ current, a start time in the past, invalid coordinates.','Validation in each route'],
  ['FR-03','Find only manufacturer-verified compatible charging points (connector standard and charging mode).','<code>allocation.js</code>'],
  ['FR-04','Detect a time-interval conflict with existing PENDING/CONFIRMED bookings on the same point.','<code>allocation.js</code>'],
  ['FR-05','Allocate a free compatible point, confirm the booking and log the decision.','<code>POST /api/bookings/allocate</code>'],
  ['FR-06','When no point is free, keep the request WAITING with alternatives ranked by wait time, distance and power.','<code>POST /api/booking-requests</code>'],
  ['FR-07','Process the highest-priority waiting request first; ties are served first-come-first-served.','<code>POST /api/booking-requests/process-next</code>'],
  ['FR-08','Expire waiting requests whose end time has passed.','process-next, step 0'],
  ['FR-09','Cancel a confirmed booking and automatically trigger queue processing.','<code>POST /api/bookings/:id/cancel</code>'],
  ['FR-10','Modify a confirmed booking’s time if it does not overlap another booking.','<code>PUT /api/bookings/:id/modify</code>'],
  ['FR-11','View bookings by user and by booking ID.','<code>GET /api/bookings/…</code>'],
  ['FR-12','List stations, vehicles, two-wheelers, connectors and compatible points, and inspect dataset statistics.','Catalogue and dataset APIs']])],
 ['Non-functional requirements',T(['ID','Category','Requirement'],[
  ['NFR-01','Consistency','No two bookings may overlap on the same point: transactions with <code>SELECT … FOR UPDATE</code>.'],
  ['NFR-02','Concurrency','One user’s booking operations are serialised with a MySQL advisory (named) lock (<code>GET_LOCK</code>, 10 s timeout).'],
  ['NFR-03','Reliability','Any failure rolls back the transaction; clear HTTP status codes (400, 404, 409, 500).'],
  ['NFR-04','Performance','Priority-queue insert and remove in O(log n).'],
  ['NFR-05','Traceability','Every allocate, cancel or modify decision is written to <code>allocation_logs</code> with a reason.'],
  ['NFR-06','Maintainability','Modular files (allocation, queue, duration, database), with configuration in <code>.env</code>.'],
  ['NFR-07','Usability','A responsive six-page React interface with clear navigation.']])],
 ['Use case / user story table',T(['ID','Actor','User story'],[
  ['UC-01','EV user','As an EV user, I want to request a charging slot for my vehicle so that I get a compatible point.'],
  ['UC-02','EV user','As an EV user, I want to be told about alternatives and my waiting status when every point is busy.'],
  ['UC-03','EV user','As an EV user, I want to cancel or reschedule my confirmed booking.'],
  ['UC-04','EV user','As an EV user, I want to see my bookings and their status.'],
  ['UC-05','System','When a booking is cancelled, the next waiting request is served automatically.'],
  ['UC-06','Operator','As an operator, I want an allocation log to audit every decision.']])],
 ['Acceptance criteria per requirement',T(['ID','Acceptance criterion'],[
  ['FR-02','A battery level of 120, or a target battery of 20 when the current level is 25, returns HTTP 400 with a clear message.'],
  ['FR-04 / FR-05','Two requests for the same point and an overlapping time never both reach CONFIRMED; the second receives 409 or WAITING.'],
  ['FR-06','With every compatible point busy, the response is WAITING with alternatives sorted by (wait, distance, power).'],
  ['FR-07','Priorities 3, 1, 2, 1 are processed in the order 1 (earlier), 1 (later), 2, 3.'],
  ['FR-09','Cancelling sets status to CANCELLED, writes a log row and triggers process-next.'],
  ['FR-10','A modification that overlaps another booking is rejected, and the original booking is unchanged.']])],
 ['Engine decomposition and requirements mapping',T(['Engine','Owner · course','Responsibility','Requirements'],[
  ['E1 · Request &amp; Scheduling','Srujana B · DS','Receive requests, order them by time and priority (min-heap), waiting queue, ranked alternatives, expiry, process-next','FR-01, FR-06, FR-07, FR-08, FR-12'],

S.architecture={subtitle:'Develop the overall design and explain the reasoning behind it.',fields:[
 ['Architecture diagram',`${SH('Engine pipeline: topics and algorithms in each engine')}<a href="architecture-engines-web.png" target="_blank" rel="noopener"><img src="architecture-engines-web.png" alt="Detailed architecture: input, engines E1, E4, E3 and E2 with their algorithms, output, MySQL tables, data preparation and REST API" style="width:100%;height:auto;border:1px solid #E4E5ED;border-radius:10px;display:block"></a><p style="margin-top:10px">Click a diagram to open it full size. E1–E4 are logical modules, not separate services: most of the logic is in <code>backend/server.js</code>, with <code>allocation.js</code>, <code>priorityQueue.js</code> and <code>chargingDuration.js</code> as helpers.</p>${SH('Layer view')}<a href="architecture-diagram-web.png" target="_blank" rel="noopener"><img src="architecture-diagram-web.png" alt="System architecture: React frontend, Express backend with engines E1 to E4, MySQL database and data import" style="width:100%;height:auto;border:1px solid #E4E5ED;border-radius:10px;display:block"></a><p style="margin-top:10px">Solid arrows are implemented; dashed arrows (frontend ↔ API) are planned. Text version of the layers:</p><div class="arch">
  <div class="layer"><b>React + Vite frontend</b><small>Six pages (Dashboard, Book a Charger, My Bookings, Charging Stations, Waiting Queue, Analytics) that call the API through <code>src/api.js</code></small></div><div class="down">↓ HTTP / JSON</div>
  <div class="layer"><b>Express.js API layer</b><small><code>backend/server.js</code>: validation, routing, transactions, status codes</small></div><div class="down">↓</div>
  <div class="layer"><b>Allocation engine (DSA)</b><small><code>priorityQueue.js</code> · <code>allocation.js</code> · <code>chargingDuration.js</code> · <code>bookingQueue.js</code> · distance and ranking</small></div><div class="down">↓ mysql2 connection pool</div>
  <div class="layer"><b>MySQL — ev_charging_db</b><small>stations, points, vehicles, compatibility, bookings, booking_requests, allocation_logs</small></div><div class="down">↑ one-time import</div>
  <div class="layer"><b>Data preparation</b><small><code>import-indian-datasets.js</code>, <code>import-chargers.js</code> ← CSV datasets in <code>data/</code></small></div></div>`],
 ['Responsibilities and interfaces',T(['Component','Responsibility','Interface'],[
  ['Frontend','User interaction and display of results','Calls REST endpoints under <code>/api</code>'],
  ['server.js','Routes, validation, transaction boundaries','Express <code>req</code> / <code>res</code>, JSON'],
  ['allocation.js','<code>findAvailablePoint(conn, vehicleModelId, start, end, candidatePointId?)</code>','Returns a point or <code>null</code>'],
  ['priorityQueue.js','Binary min-heap ordered by (priority, sequence)','<code>enqueue</code>, <code>dequeue</code>, <code>peek</code>, <code>size</code>, <code>isEmpty</code>'],
  ['chargingDuration.js','Energy and duration estimate','<code>calculateChargingDuration({…})</code>'],
  ['db.js','Pooled MySQL connections (limit 10)','<code>pool.getConnection()</code>']])],
 ['Engine interactions and dependencies',`<div class="arch">
  <div class="layer"><b>EV user</b><small>Submits a charging request: vehicle, start time, battery levels, priority, location</small></div><div class="down">↓</div>
  <div class="layer"><b>E1 · Request &amp; Scheduling</b><small>Accepts the request, estimates duration, ranks alternatives, orders waiting requests in the min-heap by (priority, arrival)</small></div><div class="down">↓ request + ranked alternatives</div>
  <div class="layer"><b>E4 · Validation &amp; Quality</b><small>Checks input (battery 0–100, target &gt; current, future start, coordinates) and that the state change is allowed (only CONFIRMED bookings can be cancelled or modified)</small></div><div class="down">↓ valid request</div>
  <div class="layer"><b>E3 · Concurrent Allocation</b><small>Per-user MySQL advisory GET_LOCK, locks candidate points with FOR UPDATE, checks time overlap, picks the first free compatible point</small></div><div class="down">↓ chosen point, or none</div>
  <div class="layer"><b>E2 · Booking Consistency</b><small>Inside one transaction: inserts the CONFIRMED booking or keeps the request WAITING, writes allocation_logs, then COMMIT — or ROLLBACK on any error</small></div><div class="down">↓</div>
  <div class="layer"><b>Result</b><small>Allocated · Queued (WAITING with alternatives) · Rejected (400 / 409)</small></div></div>
 ${SH('Feedback loop')}<div class="flow"><span>E2 commits a cancellation</span><i>→</i><span>E1 process-next takes the top waiting request</span><i>→</i><span>E3 tries each alternative in rank order</span><i>→</i><span>E2 confirms the booking or keeps it waiting</span></div>
 ${T(['Interface','From → To','Data passed'],[['Request','E1 → E4','user, vehicle model, times, battery levels, priority'],['Validated request','E4 → E3','request + ranked alternative points'],['Allocation decision','E3 → E2','point_id or none, inside an open transaction'],['Queue trigger','E2 → E1','cancellation committed → process-next']])}`],
 ['Alternatives considered and design rationale',T(['Decision','Alternative','Why the chosen option'],[
  ['Heap priority queue','Sorted array / plain FIFO','O(log n) insert and remove; FIFO alone ignores urgency'],
  ['Database row locks + transactions','Application-level flags only','Concurrent Node requests can race; the database guarantees atomicity'],
  ['MySQL (relational)','Files / NoSQL','Relationships between points, bookings and logs; ACID transactions'],
  ['Manufacturer-verified compatibility','Match by charger type only','BEE labels are infrastructure guidance, not vehicle-specific proof']])],
 ['At least three architecture decisions',`<ol><li><b>Layered separation</b>: UI, API, algorithm modules and database are independent, so each can be tested on its own.</li><li><b>Transaction per allocation</b>: search, lock, insert and log all happen inside one transaction, rolled back on any failure.</li><li><b>Waiting queue persisted in MySQL</b> (<code>booking_requests</code>) and rebuilt into an in-memory heap when processed, so the queue survives a server restart.</li><li><b>Audit log</b>: every decision has a row in <code>allocation_logs</code> with a reason.</li></ol>`],
 ['Foundational principles behind the choices','Separation of concerns, ACID properties, mutual exclusion, and choosing data structures by operation complexity.'],
 ['Unresolved questions and next action',`<ul><li>Push the integrated frontend (local project) to GitHub so the repository matches what is demonstrated.</li><li>Authentication and user accounts are not yet designed.</li></ul>`]
]};

S.algorithm={subtitle:'Explain the core algorithm, its data structures and its boundary cases.',fields:[
 ['Algorithm and state model',`<p><b>Booking states:</b> PENDING → CONFIRMED → CANCELLED. <b>Request states:</b> WAITING → (ALLOCATED | EXPIRED).</p>
 <div class="flow"><span>WAITING</span><i>→ point free →</i><span>CONFIRMED</span><i>→ user cancels →</i><span>CANCELLED</span></div><div class="flow"><span>WAITING</span><i>→ end time passed →</i><span>EXPIRED</span></div>`],
 ['Core algorithm, data structures and boundary cases',`${SH('Priority queue (binary min-heap)')}<p>Ordering key = (priority ascending, sequence ascending), so equal priorities stay first-in-first-out. <code>heapifyUp</code> and <code>heapifyDown</code> run in O(log n).</p>
 ${SH('Allocation: findAvailablePoint')}<ol><li>Select AVAILABLE points whose connector and mode match a MANUFACTURER_VERIFIED compatibility row, ordered by <code>max_power_kw DESC</code>.</li><li>For each point, lock its row with <code>FOR UPDATE</code>.</li><li>Check overlap: <code>start_time &lt; requestedEnd AND end_time &gt; requestedStart</code>.</li><li>Return the first point without a conflict; otherwise return <code>null</code>.</li></ol>
 ${SH('Charging duration')}<pre>E (kWh)   = C × (SOC_target − SOC_current) / 100
T (min)   = ceil( E / (P × η) × 60 ),  η = 0.90 by default</pre>
 ${SH('Ranking of alternatives')}<p>Sorted by (1) lowest estimated queue wait, then (2) shortest Haversine distance from the user (unknown distance = ∞), then (3) highest charging power.</p>
 ${SH('Boundary cases handled')}<ul><li>Target battery ≤ current, or above 100 → rejected.</li><li>Start time in the past → rejected.</li><li>Only one of latitude/longitude supplied → rejected.</li><li>Back-to-back bookings (one ends exactly when the next starts) are allowed because the comparison is strict.</li><li>Empty heap → <code>dequeue()</code> returns <code>null</code>.</li></ul>`],
 ['Concurrency or shared-state strategy',`<ul><li><b>Row locks</b> (<code>SELECT … FOR UPDATE</code>) on the candidate point and on overlapping bookings serialise competing allocations for the same point.</li><li><b>Advisory user lock</b> (MySQL <code>GET_LOCK(name, 10)</code>, not an operating-system mutex) stops one user from creating overlapping requests in parallel.</li><li><b>Transactions</b> make allocate, log and commit atomic.</li></ul><p class="note">Viva point: the priority queue decides the <i>order</i>; database locking prevents <i>conflicts</i>. Both are needed.</p><p class="note">These are database-backed synchronisation mechanisms that apply OS principles (mutual exclusion, critical sections, concurrency control). They block conflicting allocations; freedom from every race condition and deadlock has not been formally tested yet (concurrent test T-06 is still to run).</p>`],
 ['Business rules, permissions and state transitions',`<ul><li>Only CONFIRMED bookings can be cancelled or modified.</li><li>Every decision is logged with a reason.</li><li>A cancellation automatically triggers <code>process-next</code>.</li><li>Expired WAITING requests are marked EXPIRED before the queue is processed.</li></ul>`],
 ['Alternatives, complexity and governing concepts',T(['Operation','Complexity'],[['Heap enqueue / dequeue','O(log n)'],['Peek','O(1)'],['Build heap from k waiting requests (k enqueues)','O(k log k)'],['Scan m compatible points with overlap check','O(m) queries'],['Rank a alternatives','O(a log a)'],['Haversine distance','O(1)']])],
 ['Open questions and next action','Measure allocation latency under simulated concurrent load, and decide whether <code>bookingQueue.js</code> (in-memory) is still needed now that the queue is persisted in MySQL.']
]};

S.improvement={subtitle:'Record what changed after analysis and verification.',fields:[
 ['Discrepancy and related test IDs','Overlapping requests from the same user, and stale waiting requests remaining in the queue (T-05, T-06).'],
 ['Hypotheses and diagnostic work','Parallel requests from the same user could each pass validation before either was stored; WAITING requests past their end time were still selected by the queue.'],
 ['Findings and cause confidence',`<ul><li><b>Cause 1:</b> two requests from the same user could each pass validation before either was saved, because nothing serialised one user’s operations.</li><li><b>Cause 2:</b> the queue selected WAITING requests without checking whether their end time had already passed.</li><li><b>Cause 3:</b> BEE connector labels describe charger families, so matching on them alone could allocate an incompatible point.</li></ul><p><b>Confidence:</b> medium. The causes and fixes are confirmed by reading the code (commit 50cb645). They have not yet been confirmed by a concurrent load test.</p>`],
 ['Correction and design revisions',`<ul><li>Added a per-user <code>GET_LOCK</code> and a check against the user’s own overlapping bookings (step 9).</li><li>Added step 0 in process-next to mark expired requests.</li><li>Restricted compatibility to manufacturer-verified evidence.</li></ul>`],
 ['Before and after verification',`${T(['Check','Status'],[['Queue order after the fixes (T-01, T-02)','Pass, run on 07-11-2026'],['Duration and input rejection (T-08 to T-13)','Pass, run on 07-11-2026'],['Same-user overlapping requests, with and without the user lock (T-06)','Not yet run; needs the MySQL database'],['Expired request is skipped by process-next','Not yet run; needs the MySQL database']])}<p>No “before” measurements were recorded, because the first commit already contains the fixes.</p>`],
 ['Learning and remaining questions','A queue orders work but does not guarantee correctness under concurrency; database-level locking is needed for that.']
]};

  ['DBMS — transactions, ACID','Atomic allocation + log','BEGIN / COMMIT / ROLLBACK',F('backend/server.js')],
  ['Operating Systems — mutual exclusion','Prevent double booking','Row locks and named locks','<code>FOR UPDATE</code>, <code>GET_LOCK</code>'],
  ['Algorithms — interval overlap','Conflict detection','start &lt; end′ AND end &gt; start′',F('backend/allocation.js')],

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let section='overview';
const ORDER=['overview','team',...STAGES.map(s=>s[0])];
const stageInfo=k=>STAGES.find(s=>s[0]===k);
const filled=k=>(S[k]?.fields||[]).filter(f=>f[1]).length;
const total=k=>(S[k]?.fields||[]).length;

function navButton(id,label,cls=''){return `<button class="navbtn ${cls} ${section===id?'active':''}" onclick="go('${id}')">${label}</button>`}
function renderNav(){
 $('nav').innerHTML=navButton('overview','▦ &nbsp; Overview')+navButton('team','♧ &nbsp; Team and roles')+
  '<div class="navgroup">DESIGN JOURNEY <span style="float:right">8</span></div>'+
  STAGES.slice(0,8).map(([id,t],i)=>navButton(id,'0'+(i+1)+' &nbsp; '+esc(t),'child')).join('')+
  '<div class="navgroup">PORTFOLIO RECORDS</div>'+STAGES.slice(8).map(([id,t])=>navButton(id,esc(t))).join('');
 const title=section==='overview'?'Overview':section==='team'?'Team and roles':stageInfo(section)[1];
 $('crumb').textContent='Computer Science  ›  EV Charging Allocation  ›  '+title;
 const a=document.querySelector('#nav .active');if(a&&window.innerWidth<=760)a.scrollIntoView({inline:'center',block:'nearest'});
}
function filterNav(q){for(const b of document.querySelectorAll('#nav .navbtn'))b.style.display=b.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'}

function renderOverview(){
 const started=STAGES.slice(0,8).filter(([k])=>filled(k)>0).length;
 const done=STAGES.slice(0,8).reduce((a,[k])=>a+filled(k),0), all=STAGES.slice(0,8).reduce((a,[k])=>a+total(k),0);
 return `<div class="show-strap"></div><div class="show-hero"><span class="show-label">SEMESTER V · FOUNDATION INTEGRATION</span><h1>${esc(PROJECT.title)}</h1>
 <p>Theme: ${esc(PROJECT.theme)} · Product: ${esc(PROJECT.product)}. This system allocates limited EV charging points among many simultaneous users. It uses a priority queue, manufacturer-verified compatibility, allocation guarded by MySQL locks and transactions, and ranked alternatives when every point is busy.</p>
 <button class="btn" onclick="go('problem')">Explore design journey →</button> <a class="btn secondary" href="${REPO}" target="_blank" rel="noopener">View code ↗</a></div>
 <div class="show-kpis">
  <div class="show-kpi"><span class="k">Design blocks started</span><strong>${started} / 8</strong><span class="d">Progress recorded by the team</span></div>
  <div class="show-kpi"><span class="k">Answers documented</span><strong>${done} / ${all}</strong><span class="d">Fields with content</span></div>

 <div class="show-section-title"><h2>Tech stack</h2></div>
 <div class="flow"><span>React + Vite</span><i>→</i><span>Node.js + Express 5</span><i>→</i><span>Priority queue · allocation engine</span><i>→</i><span>MySQL (mysql2)</span><i>←</i><span>CSV datasets</span></div>
 <div class="show-section-title"><h2>Engineering design journey</h2></div>
 <p class="subtitle" style="margin:0 0 18px;font-size:15px">Open any block to see the team’s reasoning, design, evidence and learning. Incomplete work is marked as such.</p>
 <div class="show-journey">${STAGES.slice(0,8).map(([k,name,phase],i)=>`<button class="show-step" onclick="go('${k}')"><span class="stepnum">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(name)}</strong><small>${esc(phase)}</small><span class="show-pill ${filled(k)?'':'pending'}">${filled(k)?filled(k)+' / '+total(k)+' entries recorded':'Awaiting documentation'}</span></span></button>`).join('')}</div>
 <div class="show-section-title"><h2>Portfolio records</h2></div>
 <div class="show-journey">${STAGES.slice(8).map(([k,name,phase])=>`<button class="show-step" onclick="go('${k}')"><span><strong>${esc(name)}</strong><small>${esc(phase)}</small><span class="show-pill ${filled(k)?'':'pending'}">${filled(k)?filled(k)+' / '+total(k)+' entries recorded':'Awaiting documentation'}</span></span></button>`).join('')}</div>
 ${footer()}`;
}
function renderSection(k){
 const d=S[k], info=stageInfo(k), title=k==='team'?d.title:info[1], phase=k==='team'?d.phase:info[2];
 let html=`<div class="show-strap"></div><div class="eyebrow">${esc(PROJECT.team)} / ${esc(phase)}</div>
 <div class="toolbar"><div><h1>${esc(title)}</h1><p class="subtitle" style="margin-bottom:10px">${esc(d.subtitle)}</p></div><span class="show-pill">${filled(k)} / ${total(k)} answers</span></div>
 <div class="show-section-title"><h2>Documented engineering record</h2></div>`;
 html+=d.fields.map(([label,v],i)=>`<article class="show-answer"><div class="show-answer-head"><span class="number">${String(i+1).padStart(2,'0')}</span><h3>${esc(label)}</h3></div><div class="show-body">${v||TBD}</div></article>`).join('');
 html+=`<div class="toolbar pager"><button class="btn secondary" onclick="step(-1)">← Previous</button><button class="btn secondary" onclick="step(1)">Next section →</button></div>${footer()}`;
 return html;
}
function footer(){return `<div class="show-footer"><span>KLE Technological University · Computer Science · Foundation Integration Mini Project</span><span>Content drawn from the team repository and development log</span></div>`}
function render(){
 if(!ORDER.includes(section))section='overview';
 renderNav();
 $('screen').innerHTML=section==='overview'?renderOverview():renderSection(section);
}
